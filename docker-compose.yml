services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      YANDEX_API_KEY:    ${YANDEX_API_KEY}
      YANDEX_FOLDER_ID:  ${YANDEX_FOLDER_ID}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - competition_files:/app/static/competition-files
      - analytics_files:/app/static/analytics
      - hof_files:/app/static/hall-of-fame
      - static_files:/app/static
      # Логи вне /opt/taipan: json-лог docker'а удаляется вместе с контейнером
      # при каждом `docker compose down` в деплое, а git reset --hard не должен
      # их трогать. Ротация: по размеру — в приложении, по сроку — logrotate.
      - /var/log/taipan:/var/log/taipan
    environment:
      DATABASE_URL:        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY:          ${SECRET_KEY}
      REDIS_URL:           redis://redis:6379/0
      TELEGRAM_BOT_TOKEN:  ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_API_BASE:   ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_API_SECRET: ${TELEGRAM_API_SECRET:-}
      MAX_BOT_TOKEN:       ${MAX_BOT_TOKEN:-}
      SITE_URL:            ${SITE_URL:-https://taipan-tkd.ru}
      LOG_SERVICE:         backend
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY}
      YANDEX_API_KEY:      ${YANDEX_API_KEY}
      YANDEX_FOLDER_ID:    ${YANDEX_FOLDER_ID}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    restart: always

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - /var/log/taipan:/var/log/taipan
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL:       postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL:          redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_API_BASE:  ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_API_SECRET: ${TELEGRAM_API_SECRET:-}
      MAX_BOT_TOKEN:      ${MAX_BOT_TOKEN:-}
      LOG_SERVICE:        celery_worker
    mem_limit: 512m
    restart: always

  celery_beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - /var/log/taipan:/var/log/taipan
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_SERVICE: celery_beat
    mem_limit: 128m
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: always

  db-backup:
    image: postgres:15-alpine
    depends_on:
      - db
    volumes:
      # Каталог на хосте вместо docker-тома. Дамп — это ФИО родителей и детей,
      # телефоны и суммы взносов; в томе он лежал с правами 644, а раньше такие
      # же выгрузки оказывались прямо в рабочем дереве ПУБЛИЧНОГО репозитория.
      # Теперь единственное место — /var/backups/taipan с правами 700 root.
      - /var/backups/taipan/auto:/backups
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Ротация 30 дней стоит здесь, а не в logrotate на хосте: правило уезжает
    # вместе с репозиторием и не может потеряться при переезде сервера.
    # Удаление идёт через && — если pg_dump упал, старые дампы остаются на
    # месте, иначе неудачная ночь стоила бы сразу и свежей копии, и месячной.
    command: >
      sh -c "while true; do
      pg_dump $$DATABASE_URL > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
      && find /backups -maxdepth 1 -name 'backup_*.sql' -mtime +30 -delete;
      sleep 86400; done"
    restart: always

volumes:
  postgres_data:
  competition_files:
  analytics_files:
  hof_files:
  static_files:
