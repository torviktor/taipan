# Живой конфиг сайта с хоста: /etc/nginx/sites-enabled/taipan-tkd.ru
# nginx стоит НА ХОСТЕ (в docker-compose.yml сервиса nginx нет) и проксирует
# на опубликованные порты контейнеров: frontend → 3000, backend → 8000.
#
# Файл nginx/nginx.conf в этой же папке — устаревший артефакт от схемы, где
# nginx работал контейнером и ходил по именам сервисов. Он НЕ используется.
#
# После правки: scp на сервер → nginx -t → systemctl reload nginx.

server {
    server_name taipan-tkd.ru www.taipan-tkd.ru;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Сжатие текстовых ответов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /cv {
        return 301 https://taipan-tkd.ru/cv/;
    }

    location /cv/ {
        alias /opt/taipan/portfolio/;
        index portfolio.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/competition-files/ {
        proxy_pass http://localhost:8000/static/competition-files/;
        proxy_set_header Host $host;
        add_header Content-Disposition 'attachment';
        client_max_body_size 20M;
    }

    location /static/analytics/ {
        proxy_pass http://localhost:8000/static/analytics/;
        proxy_set_header Host $host;
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options nosniff;
    }

    location /static/ {
        proxy_pass http://localhost:8000/static/;
        proxy_set_header Host $host;
    }

    # Авторизация — заведомо быстрые запросы (замер: login 401 за 13 мс).
    # Таймауты подобраны короче, чем timeout: 15000 у axios на фронте: если
    # backend завис, пользователь получит быстрый 504 → «Сервис недоступен,
    # попробуйте позже», а не будет ждать и гадать. Блок обязан идти до
    # location /api/ — nginx выбирает самый длинный совпавший префикс.
    location /api/auth/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://localhost:8000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    location /api/ {
		limit_req zone=api burst=50 nodelay;
        proxy_pass http://localhost:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Здесь запас намеренно большой: под /api/ живут аналитика, AI-роуты и
        # загрузка файлов, которым 10 секунд мало. Ограничиваем только connect —
        # он обязан быть мгновенным, и именно он ловит мёртвый backend.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /assets/ {
        proxy_pass http://localhost:3000/assets/;
        proxy_set_header Host $host;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/taipan-tkd.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/taipan-tkd.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.taipan-tkd.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = taipan-tkd.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name taipan-tkd.ru www.taipan-tkd.ru;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 404; # managed by Certbot




}
